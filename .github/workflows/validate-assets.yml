name: Validate README Assets

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "cards/**"
      - "scripts/validate_assets.py"
      - ".github/workflows/validate-assets.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "cards/**"
      - "scripts/validate_assets.py"
      - ".github/workflows/validate-assets.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SVGs and README asset paths
        run: python scripts/validate_assets.py
